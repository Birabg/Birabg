<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Bira Girma: a design frame being built into code">
<style>
  .sans{font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .skel{opacity:0;animation:skel 12s ease-in-out infinite}
  .real{animation:real 12s ease-in-out infinite}
  .sel{animation:sel 12s ease-in-out infinite}
  .wire{animation:wire 12s ease-in-out infinite}
  .cursor{animation:cur 12s cubic-bezier(.5,0,.2,1) infinite}
  .ln{animation:ln 12s ease-out infinite}
  .l1{animation-name:l1}.l2{animation-name:l2}.l3{animation-name:l3}.l4{animation-name:l4}.l5{animation-name:l5}.l6{animation-name:l6}.l7{animation-name:l7}
  .caret{animation:blink 1s steps(1) infinite}
  @keyframes skel{0%,30%{opacity:1}38%,94%{opacity:0}100%{opacity:1}}
  @keyframes real{0%,33%{opacity:0}42%,92%{opacity:1}100%{opacity:0}}
  @keyframes sel{0%,17%{opacity:0}21%,92%{opacity:1}100%{opacity:0}}
  @keyframes wire{0%,42%{opacity:0}47%,92%{opacity:1}100%{opacity:0}}
  @keyframes cur{0%{transform:translate(1060px,470px);opacity:0}5%{opacity:1}20%,30%{transform:translate(660px,392px)}40%,86%{transform:translate(560px,336px);opacity:1}92%,100%{transform:translate(560px,336px);opacity:0}}
  @keyframes l1{0%,46%{opacity:0}48%,92%{opacity:1}100%{opacity:0}}
  @keyframes l2{0%,49%{opacity:0}51%,92%{opacity:1}100%{opacity:0}}
  @keyframes l3{0%,52%{opacity:0}54%,92%{opacity:1}100%{opacity:0}}
  @keyframes l4{0%,55%{opacity:0}57%,92%{opacity:1}100%{opacity:0}}
  @keyframes l5{0%,58%{opacity:0}60%,92%{opacity:1}100%{opacity:0}}
  @keyframes l6{0%,61%{opacity:0}63%,92%{opacity:1}100%{opacity:0}}
  @keyframes l7{0%,64%{opacity:0}66%,92%{opacity:1}100%{opacity:0}}
  @keyframes blink{0%{opacity:1}50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.skel,.real,.sel,.wire,.ln,.cursor,.caret{animation:none}.cursor{transform:translate(560px,336px)}}
</style>
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#252C5C"/></pattern>
  <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0D99FF"/></marker>
</defs>
<rect width="1200" height="480" rx="18" fill="#0E1330"/>
<rect width="1200" height="480" rx="18" fill="url(#dots)"/>
<text x="64" y="52" class="sans" font-size="13" fill="#7F89B8">bira.fig</text>
<text x="720" y="52" class="sans" font-size="13" fill="#7F89B8">Hero.tsx</text>
<text x="64" y="86" class="sans" font-size="12" fill="#7F89B8">Hero</text>
<rect x="64" y="96" width="600" height="300" fill="#151B44"/>
<g class="skel">
  <rect x="104" y="160" width="420" height="60" rx="8" fill="#232B60"/>
  <rect x="104" y="244" width="330" height="18" rx="9" fill="#232B60"/>
  <rect x="104" y="276" width="190" height="14" rx="7" fill="#232B60"/>
  <rect x="104" y="322" width="170" height="42" rx="21" fill="#232B60"/>
</g>
<g class="real">
  <text x="102" y="216" class="sans" font-size="66" font-weight="700" letter-spacing="-2" fill="#F4F6FF">Bira Girma</text>
  <text x="104" y="260" class="sans" font-size="20" fill="#B4BCE0">Product designer who ships the code too.</text>
  <text x="104" y="290" class="sans" font-size="15" fill="#7F89B8">Adama, Ethiopia</text>
  <rect x="104" y="322" width="170" height="42" rx="21" fill="#0D99FF"/>
  <text x="189" y="348" class="sans" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">Let's build</text>
</g>
<g class="sel">
  <rect x="64" y="96" width="600" height="300" fill="none" stroke="#0D99FF" stroke-width="1.5"/>
  <g fill="#fff" stroke="#0D99FF" stroke-width="1.5">
    <rect x="60" y="92" width="8" height="8"/><rect x="660" y="92" width="8" height="8"/>
    <rect x="60" y="392" width="8" height="8"/><rect x="660" y="392" width="8" height="8"/>
  </g>
  <rect x="318" y="410" width="92" height="22" rx="4" fill="#0D99FF"/>
  <text x="364" y="425" class="sans" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">600 × 300</text>
</g>
<path class="wire" d="M672 246 C690 246 696 246 712 246" stroke="#0D99FF" stroke-width="1.5" stroke-dasharray="4 4" fill="none" marker-end="url(#arw)"/>
<rect x="720" y="96" width="416" height="300" rx="12" fill="#090D24" stroke="#232B60"/>
<g class="mono" font-size="15" fill="#D6DBF5">
  <g fill="#3D467A" font-size="13">
    <text x="740" y="146">1</text><text x="740" y="176">2</text><text x="740" y="206">3</text><text x="740" y="236">4</text><text x="740" y="266">5</text><text x="740" y="296">6</text><text x="740" y="326">7</text>
  </g>
  <text x="768" y="146" class="ln l1"><tspan fill="#8FA8FF">export function</tspan> <tspan fill="#5CC8FF">Hero</tspan>() {</text>
  <text x="768" y="176" class="ln l2" xml:space="preserve">  <tspan fill="#8FA8FF">return</tspan> (</text>
  <text x="768" y="206" class="ln l3" xml:space="preserve">    &lt;<tspan fill="#5CC8FF">Frame</tspan> name=<tspan fill="#FFC877">"Bira Girma"</tspan></text>
  <text x="768" y="236" class="ln l4" xml:space="preserve">      role=<tspan fill="#FFC877">"design engineer"</tspan></text>
  <text x="768" y="266" class="ln l5" xml:space="preserve">      ships=<tspan fill="#FFC877">{true}</tspan> /&gt;</text>
  <text x="768" y="296" class="ln l6" xml:space="preserve">  );</text>
  <text x="768" y="326" class="ln l7">}<tspan class="caret" fill="#0D99FF">▍</tspan></text>
</g>
<g class="cursor" transform="translate(560 336)">
  <path d="M0 0V20L5.5 14.5L9.5 23.5L13 22L9 13.5H16Z" fill="#fff" stroke="#0E1330" stroke-width="1.2" stroke-linejoin="round"/>
  <rect x="16" y="22" width="40" height="20" rx="4" fill="#0D99FF"/>
  <text x="36" y="36" class="sans" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">Bira</text>
</g>
</svg>
